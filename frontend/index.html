<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiyoshi — Live Trading Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #0e1117; color: #e6e8ee; min-height: 100vh; padding: 20px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  h1 .sub { font-size: 12px; color: #8b93a7; font-weight: 400; margin-left: 8px; }
  .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .live { background: #12351f; color: #4ade80; border: 1px solid #1f5c38; }
  .paper { background: #3a2a12; color: #fbbf24; border: 1px solid #5c451f; }
  .down { background: #3a1d1d; color: #f87171; border: 1px solid #5c2828; }
  .card { background: #151823; border: 1px solid #242935; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat .label { font-size: 11px; color: #8b93a7; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
  .stat .value { font-size: 22px; font-weight: 700; }
  .stat .value.small { font-size: 13px; font-weight: 600; word-break: break-all; }
  .pos { color: #4ade80; } .neg { color: #f87171; } .muted { color: #8b93a7; }
  h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #b3b9c7; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #242935; white-space: nowrap; }
  th { color: #8b93a7; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; }
  tr:last-child td { border-bottom: none; }
  .row-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .row-head h2 { margin: 0; }
  .refresh { background: #1d2230; color: #d8dbe4; border: 1px solid #2a3040; padding: 6px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .refresh:hover { background: #262c3d; }
  .refresh:disabled { opacity: 0.5; cursor: wait; }
  .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; color: #8b93a7; text-transform: uppercase; letter-spacing: 0.5px; }
  input, select { background: #0f131b; color: #e6e8ee; border: 1px solid #2a3040; border-radius: 8px; padding: 9px 12px; font-size: 14px; font-family: inherit; }
  input:focus, select:focus { outline: none; border-color: #3b82f6; }
  .btn { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn:hover { background: #1d4ed8; }
  .quote-out { display: flex; gap: 12px; flex-wrap: wrap; }
  .venue-box { flex: 1; min-width: 220px; background: #0f131b; border: 1px solid #242935; border-radius: 10px; padding: 14px; }
  .venue-box .name { font-size: 12px; color: #8b93a7; margin-bottom: 6px; }
  .venue-box .amount { font-size: 20px; font-weight: 700; word-break: break-all; }
  .best-tag { display: inline-block; margin-top: 6px; font-size: 11px; color: #4ade80; }
  .error-banner { background: #3a1d1d; border: 1px solid #5c2828; color: #fca5a5; padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; }
  .footer { text-align: center; color: #5a6172; font-size: 12px; margin-top: 8px; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid #3b82f6; border-top-color: transparent; border-radius: 50%; animation: rot 0.8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes rot { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kiyoshi <span class="sub">Live Trading Dashboard</span></h1>
    <span id="badge" class="badge down">loading…</span>
  </header>

  <div id="error-banner" class="error-banner" style="display:none"></div>

  <div class="card">
    <div class="grid" id="stats"></div>
  </div>

  <div class="card">
    <div class="row-head">
      <h2>Opportunities from last scan</h2>
      <button class="refresh" id="refresh" onclick="load(true)">↻ Refresh</button>
    </div>
    <div id="lastscan" class="muted" style="font-size:12px;margin-bottom:10px"></div>
    <table>
      <thead><tr><th>Corridor</th><th>Route</th><th>Size</th><th>Output</th><th>Edge</th></tr></thead>
      <tbody id="opps"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Recent cycles &amp; fills</h2>
    <table>
      <thead><tr><th>Time</th><th>Event</th><th>Trade</th><th>Size</th><th>P&amp;L</th><th>TX</th></tr></thead>
      <tbody id="trades"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Convert — best rate (you sign in your own wallet)</h2>
    <div class="form-row">
      <div class="field">
        <label>Amount</label>
        <input type="number" id="cv-amount" value="10" min="0.01" step="0.01" style="width:110px">
      </div>
      <div class="field">
        <label>From</label>
        <select id="cv-from" style="min-width:110px"></select>
      </div>
      <div class="field">
        <label>To</label>
        <select id="cv-to" style="min-width:110px"></select>
      </div>
      <button class="btn" id="cv-btn" onclick="quote()">Quote</button>
    </div>
    <div id="cv-result" class="quote-out"></div>
  </div>

  <div class="footer" id="footer">—</div>
</div>

<script src="config.js"></script>
<script>
const TOKENS = ["USDT", "wBRL", "wARS", "cNGN"];
let lastStatus = null;

// ---------- render ----------
function fmt(v, d = 2) { return v === null || v === undefined ? "—" : Number(v).toFixed(d); }
function money(v) { return v === null || v === undefined ? "—" : "$" + Number(v).toFixed(4); }
function edgeCell(e) {
  if (e === null || e === undefined) return '<td class="muted">—</td>';
  const cls = e >= 0 ? "pos" : "neg";
  return `<td class="${cls}">${e >= 0 ? "+" : ""}$${Number(e).toFixed(4)}</td>`;
}

function renderStats(s) {
  const cfg = s.config || {};
  const eq = s.equity, base = s.baselineEquity;
  const pnl = (eq !== null && base !== null) ? eq - base : null;
  const pnlTxt = pnl === null ? "—" :
    `<span class="${pnl >= 0 ? 'pos' : 'neg'}">${pnl >= 0 ? "+" : ""}$${Number(pnl).toFixed(4)}</span>`;
  const wallet = (s.agent && s.agent.wallet) ? s.agent.wallet : "—";
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="label">Equity</div><div class="value">${eq === null ? "—" : "$" + Number(eq).toFixed(4)}</div></div>
    <div class="stat"><div class="label">P&amp;L</div><div class="value">${pnlTxt}</div></div>
    <div class="stat"><div class="label">Max trade</div><div class="value">$${fmt(cfg.maxTradeUsd)}</div></div>
    <div class="stat"><div class="label">Min edge</div><div class="value">$${fmt(cfg.minEdgeUsd)}</div></div>
    <div class="stat"><div class="label">Interval</div><div class="value">${fmt(cfg.intervalSec, 0)}s</div></div>
    <div class="stat"><div class="label">Agent wallet</div><div class="value small">${wallet}</div></div>
  `;
}

function renderBadge(s) {
  const el = document.getElementById("badge");
  el.className = "badge " + (s.live ? "live" : "paper");
  el.textContent = s.live ? "● Live trading" : "◐ Paper / dry-run";
}

function renderOpps(s) {
  const scan = s.lastScan;
  const tb = document.getElementById("opps");
  const ls = document.getElementById("lastscan");
  if (!scan) { tb.innerHTML = '<tr><td colspan="5" class="muted">no scan yet</td></tr>'; ls.textContent = ""; return; }
  ls.textContent = "last scan: " + scan.at;
  const rows = scan.opps.map(o => {
    const edge = o.edge;
    const cls = edge >= 0 ? "pos" : "neg";
    return `<tr>
      <td>${o.X}</td>
      <td>${o.route}</td>
      <td>$${fmt(o.sizeUsd)}</td>
      <td>$${fmt(o.outUsd, 4)}</td>
      <td class="${cls}">${edge >= 0 ? "+" : ""}$${Number(edge).toFixed(4)}</td>
    </tr>`;
  });
  tb.innerHTML = rows.length ? rows.join("") : '<tr><td colspan="5" class="muted">no opportunities</td></tr>';
}

function renderTrades(trades) {
  const tb = document.getElementById("trades");
  if (!trades || !trades.length) {
    tb.innerHTML = '<tr><td colspan="6" class="muted">no fills yet — in paper mode nothing executes; live fills appear here</td></tr>';
    return;
  }
  tb.innerHTML = trades.map(t => {
    const pn = t.pnl;
    const pnTxt = pn === null || pn === undefined ? "—" :
      `<span class="${pn >= 0 ? 'pos' : 'neg'}">${pn >= 0 ? "+" : ""}$${Number(pn).toFixed(4)}</span>`;
    const tx = t.tx || t.tx1 || t.tx2 || "";
    const txShort = tx ? tx.slice(0, 10) + "…" : "—";
    return `<tr>
      <td>${String(t.ts || "").slice(5, 19).replace("T", " ")}</td>
      <td>${t.event || ""}</td>
      <td>${t.X || ""} ${t.route || ""}</td>
      <td>${typeof t.sizeUsd === "number" ? "$" + fmt(t.sizeUsd) : "—"}</td>
      <td>${pnTxt}</td>
      <td>${txShort}</td>
    </tr>`;
  }).join("");
}

function showError(msg) {
  const b = document.getElementById("error-banner");
  b.style.display = msg ? "block" : "none";
  b.textContent = msg;
}

// ---------- fetch ----------
async function fetchJSON(path) {
  const r = await fetch(API + path, { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

async function load(manual) {
  const btn = document.getElementById("refresh");
  if (manual) btn.disabled = true;
  try {
    const [status, trades] = await Promise.all([
      fetchJSON("/status"),
      fetchJSON("/trades?limit=25"),
    ]);
    lastStatus = status;
    renderBadge(status);
    renderStats(status);
    renderOpps(status);
    renderTrades(trades);
    showError("");
    document.getElementById("footer").textContent =
      `source: ${API} · auto-refresh every 60s · ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    document.getElementById("badge").className = "badge down";
    document.getElementById("badge").textContent = "backend unreachable";
    showError(`Can't reach the trading backend at ${API}. The Render service may be asleep, redeploying, or the URL is wrong. Open the Render URL directly to check.`);
  } finally {
    btn.disabled = false;
  }
}

// ---------- convert ----------
function initConvert() {
  const from = document.getElementById("cv-from");
  const to = document.getElementById("cv-to");
  TOKENS.forEach(t => {
    from.insertAdjacentHTML("beforeend", `<option value="${t}">${t}</option>`);
    to.insertAdjacentHTML("beforeend", `<option value="${t}">${t}</option>`);
  });
}

async function quote() {
  const btn = document.getElementById("cv-btn");
  const amount = parseFloat(document.getElementById("cv-amount").value);
  const from = document.getElementById("cv-from").value;
  const to = document.getElementById("cv-to").value;
  if (!(amount > 0)) { alert("Enter an amount > 0"); return; }
  if (from === to) { alert("From and To must differ"); return; }
  btn.disabled = true; btn.textContent = "Quoting…";
  try {
    const q = await fetchJSON(`/convert/quote?from=${from}&to=${to}&amount=${amount}`);
    const uni = q.uniswap, tex = q.textile, best = q.best, adv = q.advantage;
    document.getElementById("cv-result").innerHTML = `
      <div class="venue-box">
        <div class="name">Uniswap v3 (${uni.feeTier ? "fee tier " + uni.feeTier : ""})</div>
        <div class="amount">${Number(uni.out).toFixed(6)} ${to}</div>
      </div>
      <div class="venue-box">
        <div class="name">Textile FX</div>
        <div class="amount">${Number(tex.out).toFixed(6)} ${to}</div>
      </div>
      <div class="venue-box">
        <div class="name">Best</div>
        <div class="amount">${best === "textile" ? "Textile" : "Uniswap"}</div>
        <span class="best-tag">+${Number(adv.pct).toFixed(2)}% better</span>
      </div>`;
  } catch (e) {
    document.getElementById("cv-result").innerHTML =
      `<div class="muted">quote failed: ${escapeHtml(String(e))}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = "Quote";
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

initConvert();
load();
setInterval(load, 60000);
</script>
</body>
</html>
